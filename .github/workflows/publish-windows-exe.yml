name: Build and Publish Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DDTankLauncher/DDTankLauncher.csproj

      - name: Build
        run: dotnet build DDTankLauncher/DDTankLauncher.csproj -c Release --no-restore

      - name: Publish self-contained single-file exe
        run: dotnet publish DDTankLauncher/DDTankLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDTankLauncher-win-x64.exe
          path: ./publish/DDTankLauncher.exe

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DDTankLauncher-win-x64.exe
          path: ./artifact

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifact/DDTankLauncher.exe
          asset_name: DDTankLauncher-win-x64.exe
          asset_content_type: application/octet-stream
